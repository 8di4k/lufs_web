# Nginx Production Configuration for LUFS Web
# File: nginx-production.conf
# 
# This config is optimized for production deployment with:
# - Gzip compression
# - Cache headers for static assets
# - Security headers
# - Proper reverse proxy setup for Next.js
# - SSL/TLS support (commented, ready to enable)
#
# Deployment: Use with `nginx -c $(pwd)/nginx-production.conf` or
# copy to /etc/nginx/sites-available/ and symlink to sites-enabled/

# Upstream for Next.js application
upstream lufs_web {
    # For Docker: use service name 'lufs-web' on lufs-network
    # For standalone: use localhost:3000
    server 127.0.0.1:3000;
    keepalive 64;
}

# Limit request rate (optional, for DDoS protection)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# HTTP Server (production with forced HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Logs
    access_log /var/log/nginx/lufs-web-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/lufs-web-error.log warn;

    # Client max body size
    client_max_body_size 100M;

    # Hide Nginx version
    server_tokens off;

    # ============================================================================
    # GZIP Compression (matches docker config)
    # ============================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        application/wasm;

    # ============================================================================
    # SECURITY HEADERS
    # ============================================================================
    # Content Security Policy (basic, adjust as needed)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Disable iframe embedding
    add_header X-Frame-Options "DENY" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy (formerly Feature-Policy)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # ============================================================================
    # HEALTH CHECK ENDPOINT
    # ============================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================================================
    # MAIN LOCATION - Proxy to Next.js
    # ============================================================================
    location / {
        # Rate limiting (optional)
        # limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://lufs_web;
        proxy_http_version 1.1;

        # Upgrade header for WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_cache_bypass $http_upgrade;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Important for Next.js
        proxy_set_header Connection '';
    }

    # ============================================================================
    # STATIC FILES CACHING - Next.js internal
    # ============================================================================
    location /_next/static {
        proxy_pass http://lufs_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache immutable assets for 1 year
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ============================================================================
    # PUBLIC STATIC ASSETS CACHING
    # ============================================================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|avif|woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://lufs_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache static assets for 30 days
        add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Allow offline caching for critical assets
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ============================================================================
    # BLOCK ACCESS TO HIDDEN FILES/DIRECTORIES
    # ============================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to common admin panels
    location ~ ^/(wp-admin|wp-login|admin|\.php|\.env) {
        deny all;
        access_log off;
        log_not_found off;
    }
}

